# Render Blueprint for DateWise
# Deploy entire app to Render with one click

databases:
  - name: datewise-db
    databaseName: datewise
    user: datewise
    plan: free

services:
  # Backend API Service
  - type: web
    name: datewise-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: ./backend
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: datewise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: CLIENT_URL
        sync: false  # Set to your frontend URL after deployment
      - key: ALLOWED_ORIGINS
        sync: false  # Set to your frontend URL after deployment
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: datewise-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: ./frontend
    buildCommand: npm install --production=false && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to your backend URL after deployment
    autoDeploy: true
